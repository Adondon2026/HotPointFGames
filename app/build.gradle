plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.chaquo.python"
}

android {
    namespace "com.chuanmahjong.nearby"
    compileSdkVersion "android-36.1"

    defaultConfig {
        applicationId "com.chuanmahjong.nearby"
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName "1.3"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
        // Auto-detect Python 3.13 on the build machine (Windows / Linux / CI).
        pyc {
            src = true
            stdlib = true
        }
    }
}

dependencies {
    implementation "com.google.zxing:core:3.5.3"
}
