plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.chaquo.python"
}

android {
    namespace "com.chuanmahjong.nearby"
    compileSdkVersion "android-36.1"

    defaultConfig {
        applicationId "com.chuanmahjong.nearby.zmz"
        minSdk 24
        targetSdk 36
        versionCode 6
        versionName "0.19.0-ZMZ"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }


    // ZMZ builds use a distinct app ID, title and artifact name.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "HotPointFGames-ZMZ-v0.19.0-${variant.buildType.name}.apk"
        }
    }

    packagingOptions {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
        // Auto-detect Python 3.13 on the build machine (Windows / Linux / CI).
        pyc {
            src = true
            stdlib = true
        }
    }
}

dependencies {
    implementation "com.google.zxing:core:3.5.3"
}
