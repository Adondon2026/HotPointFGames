plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.chaquo.python"
}

// Only dedicated ZMZ builds receive a separate Android applicationId and APK filename.
// Normal/main builds keep the original settings; do not fork app source directories.
def zmzBuild = providers.gradleProperty("zmzBuild").map { it.toBoolean() }.orElse(false).get()

android {
    buildFeatures { buildConfig true }
    namespace "com.chuanmahjong.nearby"
    compileSdkVersion "android-36.1"

    defaultConfig {
        applicationId "com.chuanmahjong.nearby"
        minSdk 24
        targetSdk 36
        versionCode(zmzBuild ? 7 : 4)
        versionName(zmzBuild ? "0.19.1-ZMZ" : "1.3")
        manifestPlaceholders = [gameHallLabel: (zmzBuild ? "热点游戏厅 ZMZ" : "热点游戏厅")]
        buildConfigField "boolean", "ZMZ_BUILD", (zmzBuild ? "true" : "false")

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        debug {
            applicationIdSuffix(zmzBuild ? ".zmz.debug" : ".debug")
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }


    if (zmzBuild) {
        applicationVariants.all { variant ->
            variant.outputs.all { output ->
                output.outputFileName = "HotPointFGames-ZMZ-v0.19.1-${variant.buildType.name}.apk"
            }
        }
    }

    packagingOptions {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
        // Auto-detect Python 3.13 on the build machine (Windows / Linux / CI).
        pyc {
            src = true
            stdlib = true
        }
    }
}

dependencies {
    implementation "com.google.zxing:core:3.5.3"
}
