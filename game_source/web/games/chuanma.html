
    <div id="chuanmaGame" class="hidden">
      <div class="stage">
        <div class="stage-kicker" id="cmKicker">四川麻将</div>
        <div class="stage-main" id="cmMain">等待开始</div>
        <div class="stage-sub" id="cmSub"></div>
      </div>
      <div class="notice" id="cmNotice"></div>

      <div class="cm-meld-board" id="cmMeldBoard"></div>
      <div class="muted" style="margin-top:12px">牌河</div>
      <div class="cm-river" id="cmRiver"></div>

      <div class="muted" style="margin-top:12px">你的手牌</div>
      <div class="cm-hand" id="cmHand"></div>
      <div class="selection-hint" id="cmSelection">点牌选择</div>

      <div id="cmExchangePanel" class="hidden">
        <button class="full green" id="cmExchangeBtn">确认换三张</button>
      </div>
      <div id="cmDingquePanel" class="hidden">
        <div class="actions three">
          <button data-cm-missing="W">缺万</button>
          <button data-cm-missing="T">缺筒</button>
          <button data-cm-missing="B">缺条</button>
        </div>
      </div>
      <div id="cmPlayPanel" class="hidden">
        <div class="actions three">
          <button class="red" id="cmHuBtn">胡</button>
          <button class="secondary" id="cmGangBtn">杠</button>
          <button class="green" id="cmDiscardBtn">出牌</button>
        </div>
      </div>
      <div id="cmResponsePanel" class="hidden">
        <div class="actions four">
          <button class="red" data-cm-response="hu">胡</button>
          <button data-cm-response="gang">杠</button>
          <button data-cm-response="peng">碰</button>
          <button class="secondary" data-cm-response="pass">过</button>
        </div>
      </div>
    </div>
