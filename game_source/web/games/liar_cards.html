<div id="cardsGame" class="hidden tg-table">
 <header class="tg-head"><span>骗子牌</span><span id="cardsTurnText" class="tg-turn"></span><button class="tg-link" data-table-history>记录</button><button class="tg-link" onclick="liteRules()">规则</button></header>
 <div id="cardsSeats" class="tg-seats"></div>
