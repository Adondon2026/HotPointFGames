</style></head><body><main><header><a href="/">‹ 游戏厅</a><h1>拆家大战</h1><small>双人炮击 · 道具争夺</small></header><section id="lobby"><h2>堡垒攻防</h2><p>调节角度、力度，发射炮弹。命中堡垒或争抢空中的道具，炮弹数量可设置，默认无限。道具每局随机分布，一发可拾取多个；同类增加次数，异类同时生效。</p><label for="name">昵称</label><input id="name" type="text" maxlength="12" placeholder="你的昵称"><div class="row"><button id="solo" class="primary">单人练习</button><button id="host">创建好友房</button></div><hr style="border:0;border-top:1px solid #4c6258;margin:18px 0"><label for="code">好友房间码</label><input id="code" type="text" maxlength="6" placeholder="输入 6 位房间码"><button id="join" style="width:100%">加入好友房</button><button id="resume" class="hidden" style="width:100%;margin-top:8px">继续上次对局</button><div id="err" role="status"></div></section><section id="game" class="hidden"><div id="hud"><div class="seat" id="left"><b id="n0">玩家 A</b><div class="hp"><i id="hp0"></i></div><small id="s0"></small><span class="buff" id="buff0"></span></div><div id="turn"></div><div class="seat" id="right"><b id="n1">玩家 B</b><div class="hp"><i id="hp1"></i></div><small id="s1"></small><span class="buff" id="buff1"></span></div></div><div id="stage"><canvas id="field" width="640" height="500" aria-label="炮击战场"></canvas></div><div id="controls"><div class="adjust"><button id="angleUp" aria-label="增大角度">+</button><label>角度<b id="av">42°</b></label><button id="angleDown" aria-label="减小角度">−</button></div><div class="adjust"><button id="powerUp" aria-label="增大力度">+</button><label>力度<b id="pv">65</b></label><button id="powerDown" aria-label="减小力度">−</button></div><button id="fire" class="primary">开炮</button></div><div id="windInfo" aria-label="当前风力"></div><div id="status" role="status" aria-live="polite"></div><div id="result" class="hidden"><h2 id="resultText"></h2><div class="row"><button id="again" class="primary">再来一局</button><button id="back">返回房间</button></div></div><div id="roomInfo"><span id="roomCode"></span>　<button id="copy" style="font-size:12px;padding:5px 9px">邀请</button>　<button id="leave" style="font-size:12px;padding:5px 9px">返回房间</button></div></section></main><script>
const roomPrefix=location.pathname.match(/^\/r\/[A-Fa-f0-9]{6}/)?.[0]||"";const roomToken=localStorage.getItem("gh_token"+roomPrefix)||"";
const $=id=>document.getElementById(id),canvas=$('field'),ctx=canvas.getContext('2d');let key=localStorage.getItem('gh_siege_key');if(!key){const a=new Uint8Array(24);crypto.getRandomValues(a);key=Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('gh_siege_key',key)}let room=null,rev=-1,playing=null,requesting=false,polling=false,drag=null,angle=42,power=65,lastEvent=null,animFrame=null,notice='',overview=null;const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
// Camera is a presentation-only world-to-screen transform; server physics remains 960×480.
const WORLD_W=960;let VIEW_W=460,VIEW_H=359,ZOOM=1,HOME_Y=140;
function resizeField(){const r=canvas.getBoundingClientRect();if(r.width<1||r.height<1)return;const dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);const ratio=r.width/r.height;VIEW_W=clamp(ratio*345,360,700);VIEW_H=VIEW_W/ratio;ZOOM=canvas.width/VIEW_W;HOME_Y=416-VIEW_H*.83;cameraSnap(playing&&animFrame?.[1]?cameraFocus(...animFrame[1]):home(playing?playing.event.side:room?.turn||0));if(playing?.handoff)playing.handoff={from:{...camera},to:home(room.turn)}}
window.addEventListener('resize',resizeField);
const camera={x:0,y:HOME_Y}, HANDOFF=.65;let cameraTime=0;
const home=s=>({x:s===0?0:WORLD_W-VIEW_W,y:HOME_Y});
function cameraFocus(x,y){return {x:clamp(x-VIEW_W*.5,0,WORLD_W-VIEW_W),y:clamp(y-VIEW_H*.45,Math.min(-420,HOME_Y-100),HOME_Y)}}
function cameraSnap(p){camera.x=p.x;camera.y=p.y}
function cameraLerp(p,dt){const q=1-Math.exp(-dt*10);camera.x+=(p.x-camera.x)*q;camera.y+=(p.y-camera.y)*q}
function cameraFlight(p,dt){cameraLerp(cameraFocus(p[0],p[1]),dt); // keep projectile within a safe margin, even on fast/high shots
 camera.x=clamp(clamp(camera.x,p[0]-VIEW_W+40,p[0]-40),0,WORLD_W-VIEW_W);
 camera.y=clamp(clamp(camera.y,p[1]-VIEW_H+45,p[1]-45),Math.min(-420,HOME_Y-100),HOME_Y);
}
function cameraHandoff(p,q){const t=clamp(q,0,1),e=t*t*(3-2*t);cameraSnap({x:p.from.x+(p.to.x-p.from.x)*e,y:p.from.y+(p.to.y-p.from.y)*e})}
$('name').value=localStorage.getItem('gh_name')||'';$('code').value=new URLSearchParams(location.search).get('room')||'';const saved=localStorage.getItem('gh_siege_room');if(saved)$('resume').classList.remove('hidden');
async function req(type,extra={}){const r=await fetch(roomPrefix+'/api/siege',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,key,token:roomToken,code:room?.code||$('code').value.trim(),name:$('name').value.trim()||'玩家',last:rev,...extra})});const d=await r.json();if(!d.ok){if(d.roomEnded&&roomPrefix){location.replace(roomPrefix+"/");throw Error(d.error)}throw Error(d.error)}return d}
function apply(d){const old=room;room=d;localStorage.setItem('gh_siege_room',d.code);if(d.event&&d.event.id!==rev){overview=null;lastEvent=d.event;playing={event:d.event,start:performance.now(),handoff:null};animFrame=null;cameraSnap(home(d.event.side));drag=null}else if(old&&d.rev!==rev){playing=null;lastEvent=null;animFrame=null}if(!old||old.code!==d.code||(!playing&&d.rev!==rev))cameraSnap(home(playing?playing.event.side:d.turn));if(d.mode==='dynamic'&&d.shots.every(n=>n===0)&&d.phase==='play'&&(!old||d.rev!==rev||old.phase==='wait'))overview={start:performance.now(),side:d.turn};rev=d.rev;$('lobby').classList.add('hidden');$('game').classList.remove('hidden');document.body.classList.add('in-battle');if(!old||old.code!==d.code)resizeField();update()}
async function enter(type,extra={}){if(requesting)return;requesting=true;$('err').textContent='';try{room=null;rev=-1;playing=null;lastEvent=null;apply(await req(type,extra));poll()}catch(e){$('err').textContent=e.message}finally{requesting=false;update()}}
$('solo').onclick=()=>enter('create',{bot:true});$('host').onclick=()=>enter('create',{bot:false});$('join').onclick=()=>enter('join');$('resume').onclick=()=>enter('join',{code:saved});
async function poll(){if(polling)return;polling=true;try{while(room){await new Promise(r=>setTimeout(r,350));if(!room)break;if(requesting||playing)continue;const code=room.code;try{const d=await req('state');if(room?.code===code&&!requesting&&d.rev>=rev)apply(d)}catch(e){notice=e.message;update()}}}finally{polling=false}}
function canFire(){return room&&room.phase==='play'&&room.turn===room.seat&&!room.busy&&!playing&&!overview&&!requesting}
async function fire(){if(!canFire())return;requesting=true;update();try{apply(await req('fire',{rev,angle,power}));notice=''}catch(e){notice=e.message}finally{requesting=false;update()}}
$('fire').onclick=fire;
const stepControls=[['angleDown','angle',-1],['angleUp','angle',1],['powerDown','power',-1],['powerUp','power',1]];
for(const [id,kind,delta] of stepControls){const button=$(id);let delay=null,repeat=null;const stop=()=>{clearTimeout(delay);clearInterval(repeat);delay=repeat=null};const adjust=(n=1)=>{if(!canFire())return; if(kind==='angle')angle=clamp(angle+delta*n,5,85);else power=clamp(power+delta*n,15,100);update()};button.addEventListener('pointerdown',e=>{if(!canFire())return;e.preventDefault();button.setPointerCapture(e.pointerId);stop();adjust();delay=setTimeout(()=>{repeat=setInterval(()=>adjust(2),85)},350)});for(const evt of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(evt,stop);button.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();adjust()}})}
$('copy').onclick=async()=>{let text=location.origin+'/siege?room='+room.code;try{await navigator.clipboard.writeText(text);notice='邀请链接已复制'}catch(e){prompt('复制链接发给好友',text)}update()};
function leave(){room=null;playing=null;overview=null;lastEvent=null;rev=-1;localStorage.removeItem('gh_siege_room');$('resume').classList.add('hidden');$('lobby').classList.remove('hidden');$('game').classList.add('hidden');document.body.classList.remove('in-battle');$('err').textContent=''}async function returnRoom(){if(!roomPrefix)return leave();if(!room?.host)return;if(room.phase!=='over'&&!confirm('结束本局并返回房间？'))return;try{await req('return');location.replace(roomPrefix+'/')}catch(e){notice=e.message;update()}}$('leave').onclick=returnRoom;$('back').onclick=returnRoom;$('again').onclick=async()=>{if(requesting||!room)return;requesting=true;try{apply(await req('rematch'));notice=''}catch(e){notice=e.message}finally{requesting=false;update()}};

canvas.addEventListener('pointerdown',e=>{if(!canFire())return;const [x,y]=pos(e),[sx,sy]=launcher(room.seat);if(Math.hypot(x-sx,y-sy)>80)return;drag={id:e.pointerId,x,y};canvas.setPointerCapture(e.pointerId);e.preventDefault()});canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const [x,y]=pos(e),[sx,sy]=launcher(room.seat),dx=(sx-x)*(room.seat===0?1:-1),dy=y-sy;drag.x=x;drag.y=y;angle=clamp(Math.round(Math.atan2(Math.max(1,dy),Math.max(1,dx))*180/Math.PI),5,85);power=clamp(Math.round(Math.hypot(dx,dy)*.9),15,100);update()});canvas.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const [sx,sy]=launcher(room.seat),[x,y]=pos(e);drag=null;if(Math.hypot(x-sx,y-sy)>18)fire();update()});canvas.addEventListener('pointercancel',()=>{drag=null;update()});
