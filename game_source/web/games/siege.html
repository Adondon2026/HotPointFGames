</style></head><body><main><header><a href="/">‹ 游戏厅</a><h1>拆家大战</h1><small>双人炮击 · 道具争夺</small></header><section id="lobby"><h2>堡垒攻防</h2><p>调节角度、力度，发射炮弹。命中堡垒或争抢空中的道具，炮弹数量可设置，默认无限。道具每局随机分布，一发可拾取多个；同类增加次数，异类同时生效。</p><label for="name">昵称</label><input id="name" type="text" maxlength="12" placeholder="你的昵称"><div id="siegeStandaloneSelect"><div><b>可出现的增益</b> <small>· 由房主在创建对局时决定；全不选即无增益</small></div><div id="siegeStandaloneBuffChoices" class="siege-buff-grid"></div><div class="siege-buff-actions"><button type="button" id="siegeStandaloneAll">全部开启</button><button type="button" id="siegeStandaloneNone">全部关闭</button></div></div><div class="row"><button id="solo" class="primary">单人练习</button><button id="host">创建好友房</button></div><hr style="border:0;border-top:1px solid #4c6258;margin:18px 0"><label for="code">好友房间码</label><input id="code" type="text" maxlength="6" placeholder="输入 6 位房间码"><button id="join" style="width:100%">加入好友房</button><button id="resume" class="hidden" style="width:100%;margin-top:8px">继续上次对局</button><div id="err" role="status"></div></section><section id="game" class="hidden"><div id="hud"><div class="seat" id="left"><b id="n0">玩家 A</b><div class="hp"><i id="hp0"></i></div><small id="s0"></small><span class="buff" id="buff0"></span></div><div id="turn"></div><div class="seat" id="right"><b id="n1">玩家 B</b><div class="hp"><i id="hp1"></i></div><small id="s1"></small><span class="buff" id="buff1"></span></div></div><div id="stage"><canvas id="field" width="640" height="500" aria-label="炮击战场"></canvas></div><aside id="minimap"><div class="map-head"><span>全局战场</span><button id="homeCam" aria-label="回到自己的炮台">回炮台</button></div><canvas id="mapCanvas" width="320" height="194" aria-label="全局小地图，点击或拖动切换视野"></canvas><div class="map-foot"><button id="camLeft" aria-label="向左查看">‹</button><small>ZMZ v0.19.0</small><button id="camRight" aria-label="向右查看">›</button></div></aside><div id="controls"><div class="adjust"><button id="angleUp" aria-label="增大角度">+</button><label>角度<b id="av">42°</b></label><button id="angleDown" aria-label="减小角度">−</button></div><div class="adjust"><button id="powerUp" aria-label="增大力度">+</button><label>力度<b id="pv">65</b></label><button id="powerDown" aria-label="减小力度">−</button></div><button id="stockBtn" class="hidden">增益</button><button id="fire" class="primary">开炮</button></div><aside id="stockPanel" class="hidden"><h3>本轮增益</h3><small>选择使用层数；防御在开炮后待命。</small><div id="stockRows"></div><div id="stockSummary"></div><div class="row"><button id="stockClear">清空选择</button><button id="stockClose" class="primary">完成</button></div></aside><div id="windInfo" aria-label="当前风力"></div><div id="status" role="status" aria-live="polite"></div><div id="result" class="hidden"><h2 id="resultText"></h2><p id="resultPoints" class="muted" style="font-size:13px"></p><div class="row"><button id="again" class="primary">再来一局</button><button id="back">返回房间</button></div></div><div id="siegeAudioControls" aria-label="声音设置"><button id="siegeMusicToggle" type="button" aria-label="切换背景音乐">♫ 海浪琶音</button><button id="siegeEffectToggle" type="button" aria-label="切换炮击音效">🔊 炮声开</button></div><div id="roomInfo"><span id="roomCode"></span>　<button id="copy" style="font-size:12px;padding:5px 9px">邀请</button>　<button id="leave" style="font-size:12px;padding:5px 9px">返回房间</button></div></section></main><script>
const roomPrefix=location.pathname.match(/^\/r\/[A-Fa-f0-9]{6}/)?.[0]||"";const roomToken=localStorage.getItem("gh_token"+roomPrefix)||"";
const $=id=>document.getElementById(id),canvas=$('field'),ctx=canvas.getContext('2d');let key=localStorage.getItem('gh_siege_key');if(!key){const a=new Uint8Array(24);crypto.getRandomValues(a);key=Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('gh_siege_key',key)}let room=null,rev=-1,playing=null,requesting=false,polling=false,drag=null,angle=42,power=65,lastEvent=null,animFrame=null,notice='',overview=null,motionReceipt=0,selection={},stockOpen=false,stockKey="",pan=null,livePrevious=null;const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
