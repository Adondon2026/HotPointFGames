<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#123b4b">
<title>最后一百米 · 船舶靠泊试航</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;--glass:rgba(8,33,46,.56);--edge:rgba(222,244,237,.24);--text:#f0f6ec}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#123b4b;color:var(--text);touch-action:none}button,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}#game{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;isolation:isolate}#sea{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}
.top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;z-index:4;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;gap:10px}.top>*{pointer-events:auto}.icon-btn{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--glass);color:var(--text);border:1px solid var(--edge);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:23px;text-decoration:none}.icon-btn:active{background:rgba(35,82,95,.82)}
.readout{align-self:flex-start;min-height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 16px;border-radius:13px;border:1px solid rgba(241,246,237,.16);background:rgba(8,33,46,.45);backdrop-filter:blur(5px);transition:opacity .4s ease;pointer-events:none}.readout.ghost{opacity:.12}.readout strong{font-size:18px;font-weight:680;font-variant-numeric:tabular-nums;line-height:1.1}.readout span{font-size:10px;color:#c1d4d3;letter-spacing:.07em}
.berth{position:absolute;top:calc(68px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:12px;padding:8px 12px;background:var(--glass);border:1px solid var(--edge);border-radius:12px;white-space:nowrap;backdrop-filter:blur(5px);font-size:12px;pointer-events:none}.berth b{font-variant-numeric:tabular-nums;font-size:14px;color:#f6e2a3}.berth .warning{color:#ffb99d}
.prompt{position:absolute;left:50%;top:calc(112px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-6px);width:max-content;max-width:calc(100% - 64px);text-align:center;font-size:12px;line-height:1.5;border:1px solid var(--edge);border-radius:11px;background:rgba(8,33,46,.75);padding:8px 13px;color:#f0f6ed;opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;z-index:5}.prompt.show{opacity:1;transform:translateX(-50%) translateY(0)}
.follow{position:absolute;right:16px;bottom:calc(218px + env(safe-area-inset-bottom));z-index:4;border:1px solid var(--edge);background:var(--glass);border-radius:12px;color:var(--text);min-height:36px;padding:6px 10px;font-size:12px;backdrop-filter:blur(5px)}
.control-zone{position:absolute;left:0;right:0;bottom:0;height:calc(198px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:space-between;padding:0 16px calc(14px + env(safe-area-inset-bottom));pointer-events:none;z-index:4}.control-zone>*{pointer-events:auto}
.wheel-wrap{width:151px;display:flex;flex-direction:column;align-items:center;gap:5px;user-select:none;-webkit-user-select:none}.control-caption{font-size:12px;font-weight:600;letter-spacing:.03em;color:#f2f6ed;text-shadow:0 2px 5px #12353e}.control-caption strong{font-variant-numeric:tabular-nums;font-weight:600;color:#f5dfab}.wheel{position:relative;width:143px;height:143px;border-radius:50%;border:1px solid rgba(226,241,237,.30);background:radial-gradient(circle,rgba(15,52,64,.27),rgba(5,27,38,.62));box-shadow:0 4px 20px rgba(1,18,27,.16);touch-action:none;overflow:hidden}.wheel svg{width:100%;height:100%;pointer-events:none}.wheel-disc{transform-origin:70px 70px;transition:transform .055s linear}.wheel.pressed{border-color:#e8d6a6;background:rgba(15,51,61,.72)}.wheel:focus-visible,.throttle-rail:focus-visible{outline:2px solid #fff1be;outline-offset:3px}
.throttle-wrap{width:108px;display:flex;flex-direction:column;align-items:center;gap:5px;user-select:none;-webkit-user-select:none}.throttle-rail{width:85px;height:166px;position:relative;touch-action:none;border-radius:24px;border:1px solid rgba(226,241,237,.28);background:rgba(5,27,38,.58);box-shadow:0 4px 20px rgba(1,18,27,.16)}.rail-track{position:absolute;left:40px;top:20px;bottom:20px;width:4px;border-radius:4px;background:#72929a}.rail-range{position:absolute;left:40px;top:20px;bottom:20px;width:4px;background:rgba(236,208,147,.65);transform-origin:center;pointer-events:none}.notch{position:absolute;left:31px;width:21px;height:1px;background:rgba(236,241,233,.5);transform:translateY(-50%);pointer-events:none}.notch:nth-of-type(3){height:2px;background:rgba(236,241,233,.86)}.throttle-handle{position:absolute;left:24px;top:50%;width:36px;height:25px;transform:translateY(-50%);border-radius:9px;border:1px solid #f6e7c6;background:#dce7df;box-shadow:0 2px 10px #001b28a8;display:grid;place-items:center;pointer-events:none;color:#28515c;font-weight:750;font-size:10px}.throttle-rail.pressed{border-color:#e8d6a6}.track-label{position:absolute;left:2px;font-size:10px;color:#c8d8d1;pointer-events:none}.track-label.top-label{top:9px}.track-label.middle-label{top:50%;transform:translateY(-50%)}.track-label.bottom-label{bottom:8px}
.overlay{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:rgba(1,17,27,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);touch-action:auto}
.sheet{width:min(100%,360px);max-height:calc(100% - 30px);overflow-y:auto;border-radius:19px;padding:20px;background:#153844;border:1px solid #55717a;box-shadow:0 18px 55px rgba(0,0,0,.3);touch-action:pan-y}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.sheet h2{font-size:20px;margin:0 0 4px}.sheet p{font-size:12px;color:#b8d1d0;line-height:1.6;margin:6px 0 14px}.sheet label{display:block;color:#dce9e4;font-size:13px;margin:14px 0 6px}.sheet select{width:100%;padding:12px;background:#234b57;border:1px solid #5d7b7c;border-radius:10px;color:#e9f1e8;min-height:44px}.sheet .switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;padding:8px 0}.sheet input[type=checkbox]{width:20px;height:20px;accent-color:#d5dcba}.actions{display:flex;gap:10px;margin-top:20px}.actions button{flex:1;min-height:46px;border-radius:11px;border:1px solid #65838a;background:#284e5b;color:#e9f3ed;font-weight:650}.actions button.primary{background:#d6e4c6;color:#1f4045;border-color:#d6e4c6}.score{font-size:30px;letter-spacing:3px;color:#f4d98c;text-align:center;margin:12px 0}
@media(max-width:350px){.control-zone{padding-left:8px;padding-right:8px;height:calc(176px + env(safe-area-inset-bottom))}.wheel-wrap{width:130px}.wheel{width:126px;height:126px}.throttle-wrap{width:89px}.throttle-rail{height:150px}.follow{bottom:calc(190px + env(safe-area-inset-bottom))}}
@media(max-height:620px){.control-zone{height:calc(155px + env(safe-area-inset-bottom))}.wheel-wrap{width:118px}.wheel{width:113px;height:113px}.throttle-wrap{width:80px}.throttle-rail{height:129px}.follow{bottom:calc(158px + env(safe-area-inset-bottom))}.control-caption{font-size:11px}}
</style></head>
<body><main id="game">
<canvas id="sea" aria-label="船舶靠泊俯视场景，可在空白区域拖动画面，双指缩放"></canvas>
<header class="top"><a class="icon-btn" href="/" aria-label="返回游戏大厅">‹</a>
<div id="readout" class="readout"><strong id="speed">0.0 kn</strong><span>对地航速</span></div>
<button id="menuButton" class="icon-btn" aria-label="暂停及设置" title="暂停及设置">☰</button></header>
<div id="berth" class="berth" hidden><span>船岸 <b id="gap">-- m</b></span><span>纵速 <b id="surge">-- kn</b></span></div>
<div id="prompt" class="prompt" role="status" aria-live="polite"></div>
<button id="follow" class="follow" hidden>◎ 回到船舶</button>
<div class="control-zone">
<div class="wheel-wrap"><div class="control-caption">舵轮 · <strong id="rudderLabel">正舵</strong></div>
<div id="wheel" class="wheel" role="slider" tabindex="0" aria-label="舵角，拖动旋转；点击中心回正" aria-valuemin="-35" aria-valuemax="35" aria-valuenow="0">
<svg viewBox="0 0 140 140" aria-hidden="true"><g id="wheelDisc" class="wheel-disc">
<circle cx="70" cy="70" r="49" fill="none" stroke="#e7f0e5" stroke-opacity=".84" stroke-width="6"/>
<circle cx="70" cy="70" r="58" fill="none" stroke="#d5e6df" stroke-opacity=".25" stroke-width="1.5"/>
<path d="M70 26V114M26 70H114M39 39L101 101M101 39L39 101" stroke="#d8e7e2" stroke-opacity=".82" stroke-width="4" stroke-linecap="round"/>
<circle cx="70" cy="70" r="13" fill="#dce9db" stroke="#6b9c9d" stroke-width="3"/>
<circle cx="70" cy="70" r="3" fill="#365664"/></g></svg></div></div>
<div class="throttle-wrap"><div class="control-caption">车钟 · <strong id="engineLabel">停车</strong></div>
<div id="engineRail" class="throttle-rail" role="slider" tabindex="0" aria-label="车钟，向上拖动前进，向下拖动倒车" aria-valuemin="-2" aria-valuemax="2" aria-valuenow="0">
<span class="track-label top-label">进</span><span class="track-label middle-label">停</span><span class="track-label bottom-label">倒</span>
<div class="rail-track"></div><span class="notch" style="top:20px"></span><span class="notch" style="top:calc(25% + 10px)"></span><span class="notch" style="top:50%"></span><span class="notch" style="top:calc(75% - 10px)"></span><span class="notch" style="bottom:20px;top:auto"></span>
<div id="engineHandle" class="throttle-handle">停</div>
</div></div></div>
<div id="menu" class="overlay" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
<div class="sheet-head"><h2 id="menuTitle">航行设置</h2><span style="font-size:11px;color:#aac5c3">最后一百米</span></div>
<p>舵轮按住旋转，松手保持舵角；车钟上下滑动选档。海面空白处可拖动视角或双指缩放。</p>
<label for="level">海况</label><select id="level"><option value="0">平静港池 · 初学</option><option value="1">侧风 · 进阶</option><option value="2">横流 · 挑战</option></select>
<label class="switch-row" for="assist">显示预测停车位置 <input type="checkbox" id="assist" checked></label>
<div class="actions"><button id="restart">重新开始</button><button class="primary" id="resume">继续航行</button></div>
</section></div>
<div id="finish" class="overlay" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="finishTitle">
<h2 id="finishTitle" style="text-align:center">靠泊完成</h2><div id="stars" class="score">★★★</div><p id="result" style="text-align:center">船舶已安全驶入泊位。</p><div class="actions"><button id="retry">再试一次</button><button class="primary" id="nextSea">挑战下一海况</button></div>
</section></div>
</main><script>/* SHIP_DOCK_SCRIPT */</script></body></html>
