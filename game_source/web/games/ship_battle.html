<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#123949"><title>保卫子滩 · 海战</title><style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color-scheme:dark;--glass:rgba(9,32,43,.55);--line:rgba(220,242,232,.23)}
*{box-sizing:border-box}html,body{margin:0;height:100%;width:100%;overflow:hidden;background:#123949;color:#eef5eb;touch-action:none}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid #f9d58d;outline-offset:2px}
#game{position:fixed;inset:0;overflow:hidden}#sea{width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}
.top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;align-items:center;gap:9px;pointer-events:none;z-index:3}.top>*{pointer-events:auto}
.icon{background:var(--glass);border:1px solid var(--line);border-radius:12px;color:#e9f3ea;width:40px;height:40px;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.base-bars{display:flex;gap:8px;align-items:center;flex:1;min-width:0;justify-content:center}.base{flex:1;max-width:160px;min-width:0;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:6px 9px;backdrop-filter:blur(6px)}.base-head{display:flex;justify-content:space-between;gap:3px;font-size:10px;color:#c9d7d1}.base-head span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.base-head b{font-variant-numeric:tabular-nums;color:#e9f1ea}.health{height:5px;margin-top:6px;border-radius:5px;overflow:hidden;background:#344d55}.health i{display:block;width:100%;height:100%;background:#9bdac6;transition:width .15s}.enemy i{background:#e8a38b}
.guidance{position:absolute;top:calc(66px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);max-width:calc(100vw - 36px);width:max-content;text-align:center;pointer-events:none;border-radius:9px;background:rgba(8,31,43,.65);border:1px solid rgba(255,255,255,.16);padding:6px 11px;font-size:11px;z-index:2;opacity:0;transition:opacity .25s}.guidance.visible{opacity:1}
.bottom{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));height:161px;z-index:3;display:flex;align-items:flex-end;justify-content:space-between;padding:0 13px;pointer-events:none}.bottom>*{pointer-events:auto}.rudder-area{position:relative;width:177px;height:155px;display:flex;flex-direction:column;align-items:center;gap:5px}.label{font-size:12px;font-weight:650;text-shadow:0 2px 7px #032534}.label b{color:#f9dd9e;font-variant-numeric:tabular-nums}.rudder{width:175px;height:135px;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:76px 76px 14px 14px;background:rgba(5,29,40,.45);border:1px solid var(--line);overflow:hidden;box-shadow:0 7px 25px #07212a40}.rudder svg{width:100%;height:100%;pointer-events:none}
.fire-area{width:111px;display:flex;flex-direction:column;align-items:center;gap:10px}.fire{position:relative;width:104px;height:104px;border-radius:50%;background:rgba(178,90,68,.76);color:#fff5e4;border:3px solid rgba(255,218,181,.75);box-shadow:0 5px 23px #0b1d28a6;touch-action:none;font-weight:800;font-size:22px;letter-spacing:2px}.fire:active,.fire.pressed{transform:scale(.96);background:rgba(223,112,75,.93)}.fire:disabled{opacity:.6}.fire-caption{font-size:11px;text-shadow:0 1px 6px #092734;color:#d9e9e5;white-space:nowrap}
.aim-tip{position:absolute;left:50%;bottom:calc(179px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:11px;color:#d8e9e6;background:rgba(7,30,42,.5);padding:6px 10px;border-radius:10px;pointer-events:none;white-space:nowrap;z-index:3}
.overlay{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:rgba(2,21,31,.60);backdrop-filter:blur(4px);touch-action:auto}.overlay[hidden]{display:none}.sheet{width:min(100%,345px);max-height:90%;overflow:auto;background:#173b48;border:1px solid #5e7980;padding:20px;border-radius:18px;touch-action:pan-y}.sheet h2{margin:0 0 8px;font-size:22px}.sheet p{line-height:1.65;color:#bfced0;font-size:13px;margin:10px 0}.actions{display:flex;gap:8px;margin-top:18px}.actions button{flex:1;min-height:46px;border:1px solid #738c8f;background:#294d59;border-radius:11px;color:#e5f0e8;font-weight:650}.actions button.primary{color:#203e41;background:#d6e6c9;border-color:#d6e6c9}.score{margin:15px 0;color:#f8d88c;text-align:center;font-size:17px;font-weight:650}
@media(max-width:350px){.bottom{padding:0 6px;height:143px}.rudder-area{width:145px;height:139px}.rudder{width:145px;height:113px}.fire-area{width:91px}.fire{width:88px;height:88px;font-size:18px}.aim-tip{bottom:calc(150px + env(safe-area-inset-bottom))}.base{padding:5px}.base-head{font-size:9px}}
@media(max-height:560px){.bottom{height:124px}.rudder-area{width:130px;height:123px}.rudder{width:130px;height:102px}.fire-area{width:95px}.fire{width:76px;height:76px;font-size:18px}.aim-tip{bottom:calc(136px + env(safe-area-inset-bottom))}}
</style></head><body><main id="game"><canvas id="sea" aria-label="俯视双人海战：点击海面瞄准"></canvas>
<header class="top"><button id="menuButton" class="icon" aria-label="暂停与返回房间">☰</button><div class="base-bars">
<div class="base"><div class="base-head"><span>我方子滩</span><b id="hpMine">240</b></div><div class="health"><i id="mineBar"></i></div></div>
<div class="base enemy"><div class="base-head"><span>敌方子滩</span><b id="hpEnemy">240</b></div><div class="health"><i id="enemyBar"></i></div></div></div></header>
<div id="guidance" class="guidance" role="status" aria-live="polite">点海面瞄准 · 按住开炮 · 点舵盘刻度转向</div>
<div class="aim-tip">点海面瞄准 · 点舵盘刻度转向</div>
<div class="bottom"><div class="rudder-area"><span class="label">目标舵角 <b id="rudderValue">正舵</b></span>
<div id="dial" class="rudder" role="slider" tabindex="0" aria-label="点选舵角刻度" aria-valuemin="-35" aria-valuemax="35" aria-valuenow="0">
<svg viewBox="0 0 175 135" aria-hidden="true"><path d="M19 66 A69 69 0 0 1 156 66" fill="none" stroke="#bdded5" stroke-opacity=".52" stroke-width="3"/>
<g id="ticks"></g><path id="pointer" d="M87 93L87 31" stroke="#f8d787" stroke-width="5" stroke-linecap="round"/>
<circle cx="87" cy="93" r="11" fill="#e1e9d9" stroke="#577e81" stroke-width="2"/>
<text x="87" y="123" text-anchor="middle" font-size="10" fill="#bcd9d6">点击刻度 · 松手即定</text></svg></div></div>
<div class="fire-area"><button id="fire" class="fire" aria-label="按住持续开炮">开炮</button><span class="fire-caption" id="chargeLabel">按住连续射击</span></div></div>
<div id="menu" class="overlay" hidden><div class="sheet" role="dialog" aria-modal="true"><h2>保卫子滩 · 海战</h2><p>船舶持续自动前进。点击左下半圆刻度直接设置舵角；点海面改变炮口瞄准方向，按住开炮连续射击。</p><p>炮弹穿过中间海域的增益球，立即获得巨型、分裂、爆破或弹跳效果。先摧毁对方子滩获胜。</p><div class="actions"><button id="return">返回房间</button><button class="primary" id="resume">继续战斗</button></div></div></div>
<div id="finish" class="overlay" hidden><div class="sheet" role="dialog" aria-modal="true"><h2 id="finishTitle">本局结束</h2><div id="finishText" class="score"></div><div class="actions"><button id="finishReturn">返回房间</button><button id="rematch" class="primary">再来一局</button></div></div></div>
</main><script>/* SHIP_BATTLE_SCRIPT */</script></body></html>
