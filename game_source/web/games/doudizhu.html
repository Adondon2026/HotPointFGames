    <div id="ddzGame" class="hidden">
      <div class="stage">
        <div class="stage-kicker" id="ddzKicker">叫地主</div>
        <div class="stage-main" id="ddzMain">等待叫分</div>
        <div class="stage-sub" id="ddzSub"></div>
      </div>
      <div class="ddz-small-row hidden" id="ddzBottom"></div>
      <div class="notice ddz-trick" id="ddzLastPlay">尚未出牌</div>

      <div class="muted" style="margin-top:13px">你的手牌</div>
      <div class="ddz-hand" id="ddzHand"></div>
      <div class="selection-hint" id="ddzSelection">点牌选择</div>

      <div id="ddzBidPanel" class="hidden">
        <div class="actions four">
          <button class="secondary" data-ddz-bid="0">不叫</button>
          <button data-ddz-bid="1">1 分</button>
          <button data-ddz-bid="2">2 分</button>
          <button data-ddz-bid="3">3 分</button>
        </div>
      </div>

      <div id="ddzPlayPanel" class="hidden">
        <div class="actions three">
          <button class="green" id="ddzPlayBtn">出牌</button>
          <button class="secondary" id="ddzPassBtn">不出</button>
          <button class="secondary" id="ddzHintBtn">提示</button>
        </div>
      </div>
    </div>
