<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101116">
<title>局域网游戏厅</title>
<style>
:root{--bg:#0d0e12;--panel:#17191f;--panel2:#20232b;--line:#323640;--text:#f7f4ed;--muted:#a7abb4;--gold:#e4b966;--red:#df7070;--green:#71c797;--blue:#78abe2;--shadow:0 14px 42px rgba(0,0,0,.36)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#30251d 0,transparent 34%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{touch-action:manipulation}.app{max-width:760px;margin:auto;padding:12px 14px 104px}.top{height:48px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:950;letter-spacing:.5px}.top-actions{display:flex;align-items:center;gap:8px}.icon-btn{width:38px;height:38px;padding:0;border-radius:50%;background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:850}.net{width:10px;height:10px;border-radius:50%;background:#5c626d}.net.ok{background:var(--green)}.net.wait{background:var(--gold)}.net.bad{background:var(--red)}.card{background:rgba(23,25,31,.96);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:15px;margin:11px 0;box-shadow:var(--shadow)}.hidden{display:none!important}.row{display:flex;gap:9px;align-items:center}.grow{flex:1}.title{font-size:18px;font-weight:950}.muted{font-size:13px;color:var(--muted);line-height:1.5}input,select{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:#101217;color:var(--text);padding:12px;outline:none}input:focus,select:focus{border-color:var(--gold)}button{min-height:46px;border:0;border-radius:14px;padding:11px 15px;background:var(--gold);color:#2b2418;font-weight:900;cursor:pointer}button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}button.red{background:var(--red);color:#2b0d0d}button.green{background:var(--green);color:#09291a}button.blue{background:var(--blue);color:#10233a}button:disabled{opacity:.38;filter:grayscale(.35)}.full{width:100%}.mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.mode{background:#111319;border:1px solid var(--line);border-radius:17px;padding:12px;min-height:105px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}.mode.active{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}.mode-emoji{font-size:27px}.mode-name{font-weight:950}.mode-desc{font-size:12px;color:var(--muted)}.players{display:flex;gap:8px;overflow-x:auto;padding:2px 0 3px;scrollbar-width:none}.players::-webkit-scrollbar,.hand::-webkit-scrollbar{display:none}.player{min-width:126px;background:#101217;border:1px solid var(--line);border-radius:15px;padding:10px}.player.me{border-color:var(--gold)}.player.turn{box-shadow:inset 0 0 0 2px var(--green)}.player.out{opacity:.47}.player.offline{opacity:.58;border-style:dashed}.player.self-edit{cursor:pointer}.seat-kick{margin-top:8px;width:100%;min-height:32px;padding:5px 8px;border-radius:10px;font-size:12px;background:transparent;color:var(--red);border:1px solid rgba(223,112,112,.45)}.pname{font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pmeta{font-size:12px;color:var(--muted);margin-top:5px}.stage{text-align:center;padding:13px 8px 7px}.stage-kicker{font-size:12px;color:var(--muted)}.stage-main{font-size:30px;font-weight:950;color:var(--gold);margin-top:5px}.stage-sub{font-size:13px;color:var(--muted);margin-top:3px}.notice{background:#111319;border:1px solid var(--line);border-radius:15px;padding:11px 12px;font-size:13px;color:var(--muted);text-align:center}.hand{display:flex;gap:8px;overflow-x:auto;padding:9px 3px 12px;min-height:112px;scrollbar-width:none}.play-card{width:66px;height:94px;border-radius:11px;background:linear-gradient(150deg,#fbf8ef,#d9d3c4);color:#151515;flex:none;padding:7px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 5px 0 #999284,0 10px 20px rgba(0,0,0,.35);font-weight:950;user-select:none}.play-card .big{font-size:29px;text-align:center}.play-card.selected{transform:translateY(-10px);outline:3px solid var(--gold)}.play-card.joker{background:linear-gradient(150deg,#342e43,#1f1b28);color:#f1d38e;box-shadow:0 5px 0 #0b0a0e,0 10px 20px rgba(0,0,0,.35)}.dice-reveal-list{display:grid;gap:7px;margin:12px 0}.dice-reveal-row{display:flex;align-items:center;gap:10px;background:#101217;border:1px solid var(--line);border-radius:13px;padding:9px 10px}.dice-reveal-name{width:82px;font-size:13px;font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dice-reveal-dice{display:flex;gap:5px;flex-wrap:wrap}.dice-reveal-dice span{font-size:29px;line-height:1}
.dice{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:13px 0}.die{width:58px;height:58px;border-radius:14px;background:linear-gradient(145deg,#fff,#d9deea);color:#161b26;display:grid;place-items:center;font-size:35px;box-shadow:0 5px 0 #9299aa,0 9px 18px rgba(0,0,0,.3)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.actions.three{grid-template-columns:1fr 1fr 1fr}.faces{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:9px}.face{padding:3px 0;background:#101217;color:var(--text);border:1px solid var(--line);font-size:25px}.face.active{background:var(--blue);color:#0c2238;border-color:transparent}.counter{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}.counter strong{text-align:center;font-size:25px}.counter button{padding:0}.reveal{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}.reveal-cards{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:10px 0}.mini-card{width:48px;height:68px;border-radius:8px;background:#f3efe4;color:#151515;display:grid;place-items:center;font-size:22px;font-weight:950}.mini-card.joker{background:#292433;color:#f1d18d}.result{font-size:17px;font-weight:850;line-height:1.55;text-align:center}.selection-hint{text-align:center;font-size:13px;color:var(--muted);margin-top:7px}
.ddz-hand{display:flex;align-items:flex-end;overflow-x:auto;padding:24px 4px 14px;min-height:120px;scrollbar-width:none;isolation:isolate}.ddz-hand::-webkit-scrollbar{display:none}
.ddz-card{width:52px;height:78px;flex:0 0 52px;margin-left:-22px;border-radius:9px;background:linear-gradient(150deg,#fffdf7,#ddd8cd);color:#171717;box-shadow:0 4px 0 #999388,0 8px 16px rgba(0,0,0,.28);padding:5px;display:flex;flex-direction:column;justify-content:space-between;font-weight:950;user-select:none;transition:transform .12s;position:relative}
.ddz-card:first-child{margin-left:0}.ddz-card.red-suit{color:#c43d43}.ddz-card.joker-black{background:linear-gradient(150deg,#32343b,#17191e);color:#f2f2f2}.ddz-card.joker-red{background:linear-gradient(150deg,#76333a,#35171b);color:#ffe1ca}.ddz-card.selected{transform:translateY(-16px);outline:3px solid var(--gold)}.ddz-card .rank{font-size:17px;line-height:1}.ddz-card .suit{font-size:24px;text-align:center;line-height:1}.ddz-card .mini-rank{font-size:10px;text-align:right;opacity:.7}
.ddz-small-row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:8px 0}.ddz-mini{width:35px;height:49px;border-radius:7px;background:#f6f2e8;color:#171717;display:grid;place-items:center;font-weight:900;box-shadow:0 2px 0 #8d887e;font-size:15px}.ddz-mini.red-suit{color:#c43d43}.ddz-mini.joker-black{background:#24272e;color:#f2f2f2}.ddz-mini.joker-red{background:#6d3036;color:#ffe3ce}
.ddz-role{display:inline-block;margin-left:4px;padding:2px 6px;border-radius:999px;font-size:10px;background:#3a3021;color:#f1cb7c}.ddz-trick{margin-top:10px}.actions.four{grid-template-columns:repeat(4,1fr)}

.cm-hand{display:flex;align-items:flex-end;overflow-x:auto;padding:24px 4px 16px;min-height:112px;scrollbar-width:none;isolation:isolate}.cm-hand::-webkit-scrollbar{display:none}
.cm-tile{width:48px;height:68px;flex:0 0 48px;margin-left:-18px;border-radius:8px;background:linear-gradient(150deg,#fffdf5,#ddd8ca);color:#171717;box-shadow:0 4px 0 #989184,0 8px 16px rgba(0,0,0,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;user-select:none;transition:transform .12s}.cm-tile:first-child{margin-left:0}.cm-tile strong{font-size:25px;line-height:1}.cm-tile span{font-size:13px;font-weight:900;margin-top:3px}.cm-tile.suit-W{color:#c94343}.cm-tile.suit-T{color:#3477c8}.cm-tile.suit-B{color:#27895c}.cm-tile.selected{transform:translateY(-15px);outline:3px solid var(--gold)}.cm-tile.drawn{margin-left:-9px}.cm-tile.missing-suit{box-shadow:0 4px 0 #989184,0 0 0 2px rgba(223,112,112,.5),0 8px 16px rgba(0,0,0,.28)}.cm-mini{width:33px;height:46px;flex:0 0 33px;margin-left:-8px;border-radius:6px;box-shadow:0 2px 0 #989184;font-size:12px}.cm-mini strong{font-size:17px}.cm-mini span{font-size:10px}.cm-river{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px;background:#111319;border:1px solid var(--line);border-radius:15px;padding:9px;min-height:62px}.cm-river-item{display:flex;justify-content:center}.cm-river .cm-tile{margin-left:0}.cm-meld-board{display:grid;gap:7px;margin-top:9px}.cm-meld-row{background:#101217;border:1px solid var(--line);border-radius:13px;padding:8px}.cm-meld-name{font-size:12px;color:var(--muted);margin-bottom:5px}.cm-melds{display:flex;gap:10px;overflow-x:auto}.cm-meld-group{display:flex}.cm-meld-group .cm-tile{margin-left:-7px}.cm-meld-group .cm-tile:first-child{margin-left:0}
.draw-wrap{margin-top:12px}.canvas-shell{position:relative;background:#f7f4ed;border-radius:16px;overflow:hidden;box-shadow:inset 0 0 0 1px #c8c3b7}.draw-canvas{display:block;width:100%;aspect-ratio:4/3;touch-action:none;background:#fff}.canvas-empty{position:absolute;inset:0;display:grid;place-items:center;color:#9a9a9a;font-size:13px;pointer-events:none}.draw-tools{display:flex;gap:7px;align-items:center;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.draw-tools::-webkit-scrollbar{display:none}.color-dot{width:35px;height:35px;min-height:35px;padding:0;border-radius:50%;border:3px solid transparent;flex:none}.color-dot.active{border-color:var(--gold)}.tool-btn{min-width:48px;padding:8px 10px;min-height:40px}.word-choices{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}.word-choice{background:#101217;color:var(--text);border:1px solid var(--line);text-align:left}.word-choice small{display:block;color:var(--muted);font-weight:500;margin-top:3px}.guess-row{display:flex;gap:8px;margin-top:10px}.guess-row input{flex:1}.guess-feed{display:flex;gap:6px;overflow-x:auto;padding:9px 0 1px;scrollbar-width:none}.guess-chip{white-space:nowrap;background:#101217;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:12px;color:var(--muted)}.guess-chip.correct{color:var(--green);border-color:rgba(113,199,151,.55)}.timer{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:900}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(12,13,17,.93);backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.08);padding:9px max(12px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));z-index:20}.bottom-inner{max-width:760px;margin:auto;display:flex;gap:9px}.bottom button{flex:1}.modal{position:fixed;inset:0;background:rgba(0,0,0,.67);display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:50}.sheet{width:min(100%,760px);max-height:82dvh;overflow:auto;background:#17191f;border:1px solid var(--line);border-radius:24px;padding:17px;box-shadow:var(--shadow)}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.sheet h2{font-size:19px;margin:0}.rule{font-size:14px;color:var(--muted);line-height:1.75}.rule b{color:var(--text)}.setting-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toggle{display:flex;gap:8px;align-items:center;background:#101217;border:1px solid var(--line);border-radius:14px;padding:12px}.toggle input{width:20px;height:20px;min-height:0}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#050608;color:white;padding:10px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:86%;text-align:center}.toast.show{opacity:1}
@media(max-width:520px){.mode-grid{grid-template-columns:1fr 1fr}.mode{min-height:92px}.play-card{width:59px;height:86px}.actions.three,.actions.four{grid-template-columns:1fr 1fr}.setting-grid{grid-template-columns:1fr}.ddz-card{margin-left:-24px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">局域网游戏厅</div><div class="top-actions"><div class="net" id="net"></div><button class="icon-btn" id="helpBtn">?</button><button class="icon-btn hidden" id="settingsBtn">⚙</button></div></div>

  <section class="card" id="joinCard">
    <div class="title">加入房间</div><div class="muted" style="margin:5px 0 12px">连接同一热点，支持 2～4 人。</div>
    <input id="nameInput" maxlength="10" placeholder="你的昵称"><button class="full" id="joinBtn" style="margin-top:10px">进入</button>
  </section>

  <section class="card hidden" id="lobbyCard">
    <div class="row"><div class="grow"><div class="title">选择玩法</div><div class="muted" id="lobbyHint"></div></div><button class="secondary" id="readyBtn">准备</button></div>
    <div class="mode-grid" style="margin-top:13px">
      <div class="mode" id="modeCards"><div class="mode-emoji">🂠</div><div><div class="mode-name">骗子牌</div><div class="mode-desc">暗出与质疑</div></div></div>
      <div class="mode" id="modeDice"><div class="mode-emoji">🎲</div><div><div class="mode-name">大话骰</div><div class="mode-desc">叫骰与开你</div></div></div>
      <div class="mode draw-mode" id="modeDraw"><div class="mode-emoji">🎨</div><div><div class="mode-name">你画我猜</div><div class="mode-desc">中文词条 · 轮流作画</div></div></div>
      <div class="mode" id="modeDdz"><div class="mode-emoji">🃏</div><div><div class="mode-name">斗地主</div><div class="mode-desc">1～3 人 · 自动补机器人</div></div></div>
      <div class="mode" id="modeChuanma"><div class="mode-emoji">🀄</div><div><div class="mode-name">四川麻将</div><div class="mode-desc">换三张 · 定缺 · 血战</div></div></div>
    </div>
    <div class="muted" style="margin:14px 0 7px">玩家</div><div class="players" id="playersLobby"></div>
    <button class="full hidden" id="startBtn" style="margin-top:13px">开始</button>
  </section>

  <section class="card hidden" id="gameCard">
    <div class="players" id="playersGame"></div>
