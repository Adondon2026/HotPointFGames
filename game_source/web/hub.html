<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HotPointFGames · 公共大厅</title><style>

/* Quiet hall · space and typography establish hierarchy before containers. */
:root{
  --bg:#F6F5F1;--paper:#FCFBF7;--ink:#28332D;--quiet:#626F65;
  --line:#DEE2D9;--accent:#466C58;--accent-hover:#385843;--warning:#A54F43;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.5}
main{max-width:760px;margin:auto;padding:clamp(22px,4vw,40px) 20px 64px}
header{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:30px}
header>div{min-width:0}h1{font-size:clamp(27px,5vw,32px);font-weight:400;letter-spacing:-.03em;margin:6px 0 2px;line-height:1.25}
h2{font-size:18px;font-weight:500;margin:0 0 12px;letter-spacing:-.01em}
.kicker{font-size:11px;letter-spacing:.14em;color:#77867B;font-weight:400}
.muted{font-size:13px;line-height:1.65;color:var(--quiet)}.hidden{display:none!important}
button,input,select{font:inherit;border-radius:10px;border:1px solid var(--line);min-height:44px}
button{cursor:pointer;color:var(--ink);background:var(--paper);padding:9px 13px;font-weight:500;touch-action:manipulation}
button:disabled{opacity:.46;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:active{background:var(--accent-hover)}
header button{flex:none;background:transparent;border-color:transparent;color:var(--quiet);font-size:13px;padding:8px 4px;white-space:nowrap}
input,select{width:100%;background:var(--paper);color:var(--ink);padding:10px 12px}
label{display:block;color:var(--quiet);font-size:13px;margin:14px 0 6px}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1;min-width:0}
.account-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 0 21px;margin-bottom:34px;border-bottom:1px solid var(--line)}
.account-bar b{font-weight:500;font-size:15px;display:block}
.account-bar .muted{margin-top:2px}
.account-actions{display:flex;flex-shrink:0;align-items:center;gap:6px}
.account-actions button{min-height:38px;padding:7px 10px;background:transparent;color:var(--quiet);font-size:13px;border-color:transparent}
.account-actions button:first-child{border-color:var(--line);background:var(--paper);color:var(--ink)}
.room-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px}
.room-heading h2{font-size:20px;font-weight:500;margin:0;white-space:nowrap}
#roomCount{font-size:12px;color:var(--quiet);font-weight:400;margin-left:6px}
#create{min-width:118px;white-space:nowrap}
.rooms{display:grid;gap:8px}
.room{display:flex;align-items:center;gap:14px;min-height:78px;
  padding:13px 14px;background:var(--paper);border:1px solid var(--line);border-radius:12px}
.room .info{flex:1;min-width:0}
.room b{font-size:15px;font-weight:500;display:block;margin-bottom:3px;overflow-wrap:anywhere}
.room .tag,.tag{font-size:12px;color:var(--quiet)}
.room button{flex:none;min-width:74px;background:transparent;border-color:#B7C9B9;color:var(--accent);font-size:13px}
.rooms .empty{padding:38px 18px;text-align:center;color:var(--quiet);
  border:1px dashed var(--line);border-radius:12px;font-size:14px;line-height:1.7}
.footer-tools{display:flex;justify-content:space-between;gap:10px;margin:14px 0 0}
.footer-tools button{padding:8px 0;min-height:40px;background:transparent;border:0;
  color:var(--quiet);font-size:13px;font-weight:400}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;margin:0 0 20px}
.card h2{font-size:18px}#codePanel{margin-top:12px}#err{color:var(--warning);font-size:13px;min-height:0}
#err:not(:empty){margin:9px 0}
#invite{margin-bottom:22px}#inviteUrl{overflow-wrap:anywhere;user-select:all}
#qr{display:block;width:160px;height:160px;margin:16px auto;background:#fff;padding:8px;border-radius:8px}
#copy{width:100%;margin-top:10px!important}
.auth-card{margin-top:0}.auth-card .row{margin-top:16px}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 4px}
.metrics div{background:#F0F2EC;border-radius:8px;padding:13px 5px;text-align:center}
.metrics strong{font-size:22px;font-weight:500;color:var(--ink);display:block;font-variant-numeric:tabular-nums}
.metrics small{font-size:12px;color:var(--quiet)}
.stat-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 0;border-top:1px solid var(--line);font-size:13px}
.stat-row b{font-weight:500;color:var(--accent)}
@media(max-width:400px){
  main{padding:24px 16px 48px}header{margin-bottom:24px}
  .account-bar{gap:6px;margin-bottom:28px}
  .account-actions{gap:2px}.account-actions button{font-size:12px;padding:7px 6px}
  .room-heading h2{font-size:18px}.room{padding:12px 11px;gap:9px}
  #create{min-width:108px;font-size:13px}
}
@media(prefers-reduced-motion:no-preference){button{transition:background-color .16s ease,border-color .16s ease}}

</style></head><body><main><header><div><div class="kicker">HOTPOINT</div><h1>游戏大厅</h1><div class="muted">和朋友，玩一会儿</div></div><button id="inviteBtn">邀请朋友</button></header>
<div class="account-bar"><div><b id="identityName">游客</b><div class="muted" id="identityStats">游客可直接加入房间</div></div><div class="account-actions"><button id="loginOpen">登录 / 注册</button><button id="profileOpen" class="hidden">战绩</button><button id="logout" class="hidden">退出登录</button></div></div>
<section id="accountPanel" class="card auth-card hidden"><h2>本地账户</h2><label for="name">昵称</label><input id="name" maxlength="10" autocomplete="username" placeholder="你的昵称"><label for="pin">PIN（4～8 位数字）</label><input id="pin" type="password" maxlength="8" inputmode="numeric" autocomplete="current-password" placeholder="输入 PIN"><div class="row"><button class="primary" id="login">登录</button><button id="register">注册</button><button id="cancelAuth">取消</button></div><p class="muted">账号、积分与战绩保存在游戏厅服务器。</p></section><section id="profilePanel" class="card hidden"><h2>我的战绩</h2><div id="profileBody"></div></section>
<section id="invite" class="card hidden"><h2>邀请朋友进入大厅</h2><div class="muted">好友连接同一个热点后扫描二维码。此二维码不绑定任何房间。</div><label for="addresses">服务器地址</label><select id="addresses"></select><input id="manual" class="hidden" placeholder="例如 192.168.43.1"><img id="qr" alt="大厅邀请二维码"><div id="inviteUrl" class="muted"></div><button id="copy" style="width:100%;margin-top:8px">复制链接</button></section>
<div class="room-heading"><h2>房间列表 <span id="roomCount"></span></h2><button id="create" class="primary">＋ 创建房间</button></div><div id="err" role="status"></div><div id="rooms" class="rooms" aria-live="polite"></div><div class="footer-tools"><button id="codeToggle">通过房间码加入</button><button id="refresh">刷新</button></div><section id="codePanel" class="card hidden" style="margin-top:10px"><div class="row"><input id="code" maxlength="6" placeholder="六位房间码" autocomplete="off" aria-label="房间码"><button id="join">加入</button></div></section></main><script>
const $=id=>document.getElementById(id),names={cards:'骗子牌',dice:'大话骰',draw:'你画我猜',ddz:'斗地主',chuanma:'四川麻将',army:'军棋',siege:'保卫子刊',ship:'保卫子滩 · 海战'};
const remoteCloud=location.protocol==='https:';
let accountToken=remoteCloud?'':localStorage.getItem('gh_account_token')||'',profile=null,busy=false;
const guest=localStorage.getItem('gh_guest_name')||('游客'+Math.floor(1000+Math.random()*9000));localStorage.setItem('gh_guest_name',guest);
async function api(path,data){const r=await fetch(path,data===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||'请求失败');return d}
function err(msg=''){$('err').textContent=msg}
let guestPref=localStorage.getItem('gh_guest_pref');if(!guestPref){const a=new Uint8Array(24);crypto.getRandomValues(a);guestPref=Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('gh_guest_pref',guestPref)}
function identity(){return {name:profile?.name||guest,accountToken,guestPref}}
function showIdentity(){ if(remoteCloud){
 $('identityName').textContent=profile?.name||'云账号';
 $('identityStats').textContent=profile?'账号名 '+profile.username+' · 已登录云端':'请登录云账号';
 $('loginOpen').classList.add('hidden');$('logout').classList.toggle('hidden',!profile);
 $('profileOpen').classList.toggle('hidden',!profile);$('profileOpen').textContent='修改昵称';
 $('accountPanel').classList.add('hidden');$('inviteBtn').classList.add('hidden');return;
 }
 $('identityName').textContent=profile?.name||guest;$('identityStats').textContent=profile?`${profile.points} 积分 · ${profile.games} 局 · ${profile.wins} 胜`:'游客 · 无需注册即可游玩';$('loginOpen').classList.toggle('hidden',!!profile);$('logout').classList.toggle('hidden',!profile);$('profileOpen').classList.toggle('hidden',!profile);if(profile){const el=$('profileBody');el.replaceChildren();const metrics=document.createElement('div');metrics.className='metrics';for(const [n,v] of [['累计积分',profile.points],['对局',profile.games],['获胜',profile.wins]]){const box=document.createElement('div'),b=document.createElement('strong'),t=document.createElement('small');b.textContent=v;t.textContent=n;box.append(b,t);metrics.append(box)}el.append(metrics);for(const s of profile.stats||[]){const row=document.createElement('div');row.className='stat-row';const a=document.createElement('span'),b=document.createElement('b');a.textContent=(names[s.game]||s.game)+' · '+s.games+' 局 / '+s.wins+' 胜';b.textContent=s.points+' 分';row.append(a,b);el.append(row)}const note=document.createElement('p');note.className='muted';note.textContent='练习 '+(profile.practice?.games||0)+' 局 · '+(profile.practice?.wins||0)+' 胜';el.append(note)}}
async function loadProfile(){if(remoteCloud){
 try{const r=await fetch('/cloud/me',{cache:'no-store'});if(!r.ok)throw Error('登录已失效');
 profile=await r.json();localStorage.setItem('gh_name',profile.name);
 }catch(e){profile=null;err(e.message)}
 showIdentity();return;
 }if(!accountToken){showIdentity();return}try{const d=await api('/api/account',{type:'profile',accountToken});profile=d.profile;localStorage.setItem('gh_name',profile.name)}catch(e){if(e.message.includes('重新登录')){accountToken='';localStorage.removeItem('gh_account_token');err('登录已过期，请重新登录或以游客身份进入。')}else{err(e.message)}}showIdentity()}
function clearSeats(){for(const k of Object.keys(localStorage))if(/^gh_(token|player_id|seat_key|room_claim)\/r\//.test(k))localStorage.removeItem(k)}
async function auth(type){if(remoteCloud)return;if(busy)return;busy=true;err();try{const d=await api('/api/account',{type,name:$('name').value.trim(),pin:$('pin').value});clearSeats();accountToken=d.accountToken;profile=d.profile;localStorage.setItem('gh_account_token',accountToken);localStorage.setItem('gh_name',profile.name);$('pin').value='';$('accountPanel').classList.add('hidden');showIdentity()}catch(e){err(e.message)}finally{busy=false}}
$('loginOpen').onclick=()=>{$('accountPanel').classList.toggle('hidden');$('name').focus()};$('cancelAuth').onclick=()=> $('accountPanel').classList.add('hidden');$('login').onclick=()=>auth('login');$('register').onclick=()=>auth('register');$('pin').onkeydown=e=>{if(e.key==='Enter')auth('login')};$('profileOpen').onclick=()=>{if(remoteCloud){
 const old=document.getElementById('cloudNicknamePanel');
 if(old){old.remove();return}
 const panel=document.createElement('section');panel.id='cloudNicknamePanel';panel.className='card auth-card';
 panel.innerHTML='<h2>游戏昵称</h2><label for="cloudNickname">昵称（1～12字）</label><input id="cloudNickname" maxlength="12" autocomplete="nickname"><div class="row"><button id="saveCloudNickname" class="primary">保存昵称</button><button id="closeCloudNickname">取消</button></div><p class="muted">账号名固定，用于登录；修改昵称后下次加入房间会显示新名字。</p>';
 document.querySelector('.account-bar').after(panel);
 $('cloudNickname').value=profile?.name||'';
 $('closeCloudNickname').onclick=()=>panel.remove();
 $('saveCloudNickname').onclick=async()=>{const b=$('saveCloudNickname');b.disabled=true;
 try{const d=await fetch('/cloud/account',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'rename',displayName:$('cloudNickname').value.trim()})});
 const body=await d.json();if(!d.ok)throw Error(body.error||'修改失败');
 profile=body;localStorage.setItem('gh_name',profile.name);showIdentity();panel.remove()}
 catch(e){err(e.message);b.disabled=false}};return;
 }
 $('profilePanel').classList.toggle('hidden');loadProfile()};$('logout').onclick=async()=>{if(remoteCloud){
 await fetch('/cloud/account',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'logout'})});
 clearSeats();location.href='/';return;
 }if(busy)return;busy=true;try{await api('/api/account',{type:'logout',accountToken});accountToken='';profile=null;localStorage.removeItem('gh_account_token');clearSeats();$('profilePanel').classList.add('hidden');showIdentity()}catch(e){err(e.message)}finally{busy=false}};
function storeSeat(code,d,key){const prefix='/r/'+code;localStorage.setItem('gh_token'+prefix,d.token);localStorage.setItem('gh_player_id'+prefix,d.playerId);localStorage.setItem('gh_seat_key'+prefix,key);location.href=prefix+'/'}
async function create(){if(busy)return;busy=true;$('create').disabled=true;err();try{const d=await api('/api/rooms',identity());storeSeat(d.code,d,d.seatKey)}catch(e){err(e.message);busy=false;$('create').disabled=false}}
async function enter(code){if(busy)return;busy=true;err();const prefix='/r/'+code;const key=localStorage.getItem('gh_seat_key'+prefix)||(crypto.randomUUID?.()||('seat_'+Date.now()+'_'+Math.random()));try{const d=await api(prefix+'/api/join',{...identity(),token:localStorage.getItem('gh_token'+prefix)||'',seatKey:key});storeSeat(code,d,key)}catch(e){err(e.message);busy=false}}
let roomKey='';async function load(){try{const d=await api('/api/rooms');const k=JSON.stringify(d.rooms);if(k===roomKey)return;roomKey=k;const el=$('rooms');el.replaceChildren();$('roomCount').textContent=d.rooms.length+' 个';for(const r of d.rooms){const card=document.createElement('div');card.className='room';const info=document.createElement('div');info.className='info';const b=document.createElement('b');b.textContent=r.host+' 的房间';const desc=document.createElement('div');desc.className='muted';desc.textContent=(names[r.mode]||'尚未选择游戏')+' · '+r.count+'/'+r.capacity+' 人 · '+(r.phase==='lobby'?'等待中':'游戏中');info.append(b,desc);const button=document.createElement('button');button.textContent='加入';button.onclick=()=>enter(r.code);card.append(info,button);el.append(card)}if(!d.rooms.length){const p=document.createElement('div');p.className='empty';p.textContent='还没有房间，创建一个邀请朋友吧。';el.append(p)}}catch(e){err(e.message)}}
$('create').onclick=create;$('codeToggle').onclick=()=>{$('codePanel').classList.toggle('hidden');$('code').focus()};$('join').onclick=()=>{const c=$('code').value.trim().toUpperCase();if(!/^[A-F0-9]{6}$/.test(c)){err('请输入正确的六位房间码');return}enter(c)};$('code').onkeydown=e=>{if(e.key==='Enter')$('join').click()};$('refresh').onclick=load;showIdentity();loadProfile();load();setInterval(load,3000);
function qr(){const val=$('addresses').value;$('manual').classList.toggle('hidden',val!=='manual');const u=val==='manual'?($('manual').value.trim()?'http://'+$('manual').value.trim()+':'+(location.port||'8000')+'/':''):val;$('inviteUrl').textContent=u||'请填写服务器局域网 IP';$('qr').classList.toggle('hidden',!u);if(u)$('qr').src='/api/qr?url='+encodeURIComponent(u)}$('inviteBtn').onclick=async()=>{if(!$('invite').classList.toggle('hidden')){try{const d=await api('/api/invite');let urls=d.urls||[];if(/^\d+\.\d+\.\d+\.\d+$/.test(location.hostname)&&!location.hostname.startsWith('127.'))urls=[location.origin+'/',...urls.filter(x=>x!==location.origin+'/')];$('addresses').replaceChildren();for(const u of urls){const o=document.createElement('option');o.value=u;o.textContent=u;$('addresses').append(o)}const o=document.createElement('option');o.value='manual';o.textContent='手动填写局域网 IP';$('addresses').append(o);qr()}catch(e){$('err').textContent=e.message}}};$('addresses').onchange=qr;$('manual').oninput=qr;$('copy').onclick=async()=>{const text=$('inviteUrl').textContent;try{await navigator.clipboard.writeText(text)}catch(e){prompt('复制大厅链接',text)}};
</script></body></html>
