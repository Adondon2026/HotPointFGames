<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HotPointFGames · 公共大厅</title><style>
*{box-sizing:border-box}body{margin:0;background:#102b25;color:#e6eddc;font:15px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:24px 16px 40px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}h1{font-size:25px;margin:4px 0}h2{font-size:17px;margin:0 0 12px}.kicker{font-size:11px;letter-spacing:2px;color:#b2c7a8}.muted{color:#b0c6b7;font-size:13px;line-height:1.5}.card{background:#1c3b31;border:1px solid #426353;border-radius:16px;padding:16px;margin-bottom:14px}button,input,select{font:inherit;color:inherit;border:1px solid #607d6c;background:#18372d;border-radius:10px;padding:11px 12px;min-height:44px}button{cursor:pointer;font-weight:650}button.primary{background:#cbe59f;color:#1e3827;border-color:#cbe59f}button:disabled{opacity:.5;cursor:default}label{display:block;font-size:13px;color:#c4d6c3;margin:10px 0 5px}select,input{width:100%}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.rooms{display:grid;gap:8px}.room{display:flex;align-items:center;gap:12px;border:1px solid #486756;background:#213f34;border-radius:11px;padding:12px}.room .info{flex:1;min-width:0}.room b{display:block;margin-bottom:3px;overflow-wrap:anywhere}.room button{min-width:76px}.tag{font-size:12px;color:#d3e5b3}.hidden{display:none!important}#qr{width:160px;height:160px;background:white;padding:6px;border-radius:8px;margin:12px auto;display:block}#err{color:#ffc2a8;min-height:18px;font-size:13px}#invite{margin:0 0 14px}#inviteUrl{word-break:break-all;user-select:all}#create{width:100%;margin-top:10px}.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 10px}#account{max-width:100%;overflow-wrap:anywhere}@media(max-width:400px){main{padding:16px 12px}.card{padding:12px}h1{font-size:22px}}

header{margin-bottom:16px}header h1{margin:4px 0}header button{white-space:nowrap}.account-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #38574b;margin-bottom:20px}.account-bar b{display:block;font-size:16px}.account-bar .muted{margin-top:4px}.account-actions{display:flex;gap:6px;flex-shrink:0}.account-actions button{padding:8px 10px;min-height:38px;font-size:13px}#create{width:auto;margin:0;white-space:nowrap}.room-heading{display:flex;align-items:center;justify-content:space-between;margin:20px 0 12px}.room-heading h2{margin:0;font-size:20px}.room{min-height:74px}.room .info b{font-size:16px}.rooms .empty{padding:32px 14px;text-align:center;color:#b0c6b7;border:1px dashed #557565;border-radius:12px}.footer-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}.footer-tools button{font-size:13px;min-height:38px}.auth-card{margin-top:0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.metrics div{background:#122e25;border-radius:9px;padding:12px 4px;text-align:center}.metrics strong{display:block;font-size:21px;color:#cbe59f}.metrics small{color:#b0c6b7}.stat-row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid #38574b;font-size:13px}#err:not(:empty){margin:8px 0}#accountPanel label{margin-top:8px}#accountPanel .row{margin-top:8px}#roomCount{color:#b0c6b7;font-size:13px;font-weight:400;margin-left:5px}@media(max-width:400px){.account-bar{gap:6px}.account-actions button{padding:7px 8px}.room-heading h2{font-size:19px}}
</style></head><body><main><header><div><div class="kicker">HOTPOINT / OFFLINE</div><h1>游戏大厅</h1><div class="muted">和朋友一起玩 · v0.18.2</div></div><button id="inviteBtn">邀请 · 二维码</button></header>
<div class="account-bar"><div><b id="identityName">游客</b><div class="muted" id="identityStats">游客可直接加入房间</div></div><div class="account-actions"><button id="loginOpen">登录 / 注册</button><button id="profileOpen" class="hidden">战绩</button><button id="logout" class="hidden">退出登录</button></div></div>
<section id="accountPanel" class="card auth-card hidden"><h2>本地账户</h2><label for="name">昵称</label><input id="name" maxlength="10" autocomplete="username" placeholder="你的昵称"><label for="pin">PIN（4～8 位数字）</label><input id="pin" type="password" maxlength="8" inputmode="numeric" autocomplete="current-password" placeholder="输入 PIN"><div class="row"><button class="primary" id="login">登录</button><button id="register">注册</button><button id="cancelAuth">取消</button></div><p class="muted">账号、积分与战绩保存在游戏厅服务器。</p></section><section id="profilePanel" class="card hidden"><h2>我的战绩</h2><div id="profileBody"></div></section>
<section id="invite" class="card hidden"><h2>邀请朋友进入大厅</h2><div class="muted">好友连接同一个热点后扫描二维码。此二维码不绑定任何房间。</div><label for="addresses">服务器地址</label><select id="addresses"></select><input id="manual" class="hidden" placeholder="例如 192.168.43.1"><img id="qr" alt="大厅邀请二维码"><div id="inviteUrl" class="muted"></div><button id="copy" style="width:100%;margin-top:8px">复制链接</button></section>
<div class="room-heading"><h2>房间列表 <span id="roomCount"></span></h2><button id="create" class="primary">＋ 创建房间</button></div><div id="err" role="status"></div><div id="rooms" class="rooms" aria-live="polite"></div><div class="footer-tools"><button id="codeToggle">通过房间码加入</button><button id="refresh">刷新</button></div><section id="codePanel" class="card hidden" style="margin-top:10px"><div class="row"><input id="code" maxlength="6" placeholder="六位房间码" autocomplete="off" aria-label="房间码"><button id="join">加入</button></div></section></main><script>
const $=id=>document.getElementById(id),names={cards:'骗子牌',dice:'大话骰',draw:'你画我猜',ddz:'斗地主',chuanma:'四川麻将',army:'军棋',siege:'拆家大战'};
let accountToken=localStorage.getItem('gh_account_token')||'',profile=null,busy=false;
const guest=localStorage.getItem('gh_guest_name')||('游客'+Math.floor(1000+Math.random()*9000));localStorage.setItem('gh_guest_name',guest);
async function api(path,data){const r=await fetch(path,data===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||'请求失败');return d}
function err(msg=''){$('err').textContent=msg}
let guestPref=localStorage.getItem('gh_guest_pref');if(!guestPref){const a=new Uint8Array(24);crypto.getRandomValues(a);guestPref=Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('gh_guest_pref',guestPref)}
function identity(){return {name:profile?.name||guest,accountToken,guestPref}}
function showIdentity(){ $('identityName').textContent=profile?.name||guest;$('identityStats').textContent=profile?`${profile.points} 积分 · ${profile.games} 局 · ${profile.wins} 胜`:'游客 · 无需注册即可游玩';$('loginOpen').classList.toggle('hidden',!!profile);$('logout').classList.toggle('hidden',!profile);$('profileOpen').classList.toggle('hidden',!profile);if(profile){const el=$('profileBody');el.replaceChildren();const metrics=document.createElement('div');metrics.className='metrics';for(const [n,v] of [['累计积分',profile.points],['对局',profile.games],['获胜',profile.wins]]){const box=document.createElement('div'),b=document.createElement('strong'),t=document.createElement('small');b.textContent=v;t.textContent=n;box.append(b,t);metrics.append(box)}el.append(metrics);for(const s of profile.stats||[]){const row=document.createElement('div');row.className='stat-row';const a=document.createElement('span'),b=document.createElement('b');a.textContent=(names[s.game]||s.game)+' · '+s.games+' 局 / '+s.wins+' 胜';b.textContent=s.points+' 分';row.append(a,b);el.append(row)}const note=document.createElement('p');note.className='muted';note.textContent='练习 '+(profile.practice?.games||0)+' 局 · '+(profile.practice?.wins||0)+' 胜';el.append(note)}}
async function loadProfile(){if(!accountToken){showIdentity();return}try{const d=await api('/api/account',{type:'profile',accountToken});profile=d.profile;localStorage.setItem('gh_name',profile.name)}catch(e){if(e.message.includes('重新登录')){accountToken='';localStorage.removeItem('gh_account_token');err('登录已过期，请重新登录或以游客身份进入。')}else{err(e.message)}}showIdentity()}
function clearSeats(){for(const k of Object.keys(localStorage))if(/^gh_(token|player_id|seat_key|room_claim)\/r\//.test(k))localStorage.removeItem(k)}
async function auth(type){if(busy)return;busy=true;err();try{const d=await api('/api/account',{type,name:$('name').value.trim(),pin:$('pin').value});clearSeats();accountToken=d.accountToken;profile=d.profile;localStorage.setItem('gh_account_token',accountToken);localStorage.setItem('gh_name',profile.name);$('pin').value='';$('accountPanel').classList.add('hidden');showIdentity()}catch(e){err(e.message)}finally{busy=false}}
$('loginOpen').onclick=()=>{$('accountPanel').classList.toggle('hidden');$('name').focus()};$('cancelAuth').onclick=()=> $('accountPanel').classList.add('hidden');$('login').onclick=()=>auth('login');$('register').onclick=()=>auth('register');$('pin').onkeydown=e=>{if(e.key==='Enter')auth('login')};$('profileOpen').onclick=()=>{$('profilePanel').classList.toggle('hidden');loadProfile()};$('logout').onclick=async()=>{if(busy)return;busy=true;try{await api('/api/account',{type:'logout',accountToken});accountToken='';profile=null;localStorage.removeItem('gh_account_token');clearSeats();$('profilePanel').classList.add('hidden');showIdentity()}catch(e){err(e.message)}finally{busy=false}};
function storeSeat(code,d,key){const prefix='/r/'+code;localStorage.setItem('gh_token'+prefix,d.token);localStorage.setItem('gh_player_id'+prefix,d.playerId);localStorage.setItem('gh_seat_key'+prefix,key);location.href=prefix+'/'}
async function create(){if(busy)return;busy=true;$('create').disabled=true;err();try{const d=await api('/api/rooms',identity());storeSeat(d.code,d,d.seatKey)}catch(e){err(e.message);busy=false;$('create').disabled=false}}
async function enter(code){if(busy)return;busy=true;err();const prefix='/r/'+code;const key=localStorage.getItem('gh_seat_key'+prefix)||(crypto.randomUUID?.()||('seat_'+Date.now()+'_'+Math.random()));try{const d=await api(prefix+'/api/join',{...identity(),token:localStorage.getItem('gh_token'+prefix)||'',seatKey:key});storeSeat(code,d,key)}catch(e){err(e.message);busy=false}}
let roomKey='';async function load(){try{const d=await api('/api/rooms');const k=JSON.stringify(d.rooms);if(k===roomKey)return;roomKey=k;const el=$('rooms');el.replaceChildren();$('roomCount').textContent=d.rooms.length+' 个';for(const r of d.rooms){const card=document.createElement('div');card.className='room';const info=document.createElement('div');info.className='info';const b=document.createElement('b');b.textContent=r.host+' 的房间';const desc=document.createElement('div');desc.className='muted';desc.textContent=(names[r.mode]||'尚未选择游戏')+' · '+r.count+'/'+r.capacity+' 人 · '+(r.phase==='lobby'?'等待中':'游戏中');info.append(b,desc);const button=document.createElement('button');button.textContent='加入';button.onclick=()=>enter(r.code);card.append(info,button);el.append(card)}if(!d.rooms.length){const p=document.createElement('div');p.className='empty';p.textContent='还没有房间，创建一个邀请朋友吧。';el.append(p)}}catch(e){err(e.message)}}
$('create').onclick=create;$('codeToggle').onclick=()=>{$('codePanel').classList.toggle('hidden');$('code').focus()};$('join').onclick=()=>{const c=$('code').value.trim().toUpperCase();if(!/^[A-F0-9]{6}$/.test(c)){err('请输入正确的六位房间码');return}enter(c)};$('code').onkeydown=e=>{if(e.key==='Enter')$('join').click()};$('refresh').onclick=load;showIdentity();loadProfile();load();setInterval(load,3000);
function qr(){const val=$('addresses').value;$('manual').classList.toggle('hidden',val!=='manual');const u=val==='manual'?($('manual').value.trim()?'http://'+$('manual').value.trim()+':'+(location.port||'8000')+'/':''):val;$('inviteUrl').textContent=u||'请填写服务器局域网 IP';$('qr').classList.toggle('hidden',!u);if(u)$('qr').src='/api/qr?url='+encodeURIComponent(u)}$('inviteBtn').onclick=async()=>{if(!$('invite').classList.toggle('hidden')){try{const d=await api('/api/invite');let urls=d.urls||[];if(/^\d+\.\d+\.\d+\.\d+$/.test(location.hostname)&&!location.hostname.startsWith('127.'))urls=[location.origin+'/',...urls.filter(x=>x!==location.origin+'/')];$('addresses').replaceChildren();for(const u of urls){const o=document.createElement('option');o.value=u;o.textContent=u;$('addresses').append(o)}const o=document.createElement('option');o.value='manual';o.textContent='手动填写局域网 IP';$('addresses').append(o);qr()}catch(e){$('err').textContent=e.message}}};$('addresses').onchange=qr;$('manual').oninput=qr;$('copy').onclick=async()=>{const text=$('inviteUrl').textContent;try{await navigator.clipboard.writeText(text)}catch(e){prompt('复制大厅链接',text)}};
</script></body></html>
