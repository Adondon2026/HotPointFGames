name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main, 'friend/**', 'feature/**', 'Zmz_dev']
    paths:
      - 'game_source/**'
      - 'app/**'
      - 'tools/**'
      - 'tests/test_android_bridge.py'
      - 'tests/test_game_update_manifest.py'
      - '*.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'game_source/**'
      - 'app/**'
      - 'tools/**'
      - 'tests/test_android_bridge.py'
      - 'tests/test_game_update_manifest.py'
      - '*.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android platform
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and sync game source
        run: |
          python tests/test_game_update_manifest.py
          python tests/test_zmz_channel.py
          python game_source/tests/smoke_test.py
          python game_source/tests/test_lite.py
          python game_source/tests/test_bots.py
          python game_source/tests/test_table.py
          python game_source/tests/test_other_tables.py
          python game_source/tests/test_feedback.py
          python game_source/tests/test_army.py
          python game_source/tests/test_army_feedback.py
          python game_source/tests/test_siege.py
          python game_source/tests/test_multiroom.py
          python game_source/tests/test_siege_dynamic.py
          python game_source/tests/test_siege_balance.py
          python game_source/tests/test_siege_fields.py
          python game_source/tests/test_siege_v12.py
          python game_source/tests/test_siege_v13.py
          python game_source/tests/test_siege_v14.py
          python game_source/tests/test_siege_v15.py
          python game_source/tests/test_siege_v16.py
          python game_source/tests/test_siege_v17.py
          python game_source/tests/test_siege_v18.py
          python game_source/tests/test_siege_v181.py
          python game_source/tests/test_siege_v182.py
          python game_source/tests/test_siege_buff_filter.py
          python game_source/tests/test_scores_all.py
          node game_source/tests/test_army_presentation.js
          python tools/sync_game_source.py
          python tests/test_android_bridge.py
      - name: Build Android APK
        run: bash gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HotPointFGames-ZMZ-v1.4.0-Android
          path: app/build/outputs/apk/debug/HotPointFGames-ZMZ-v1.4.0-debug.apk
          if-no-files-found: error
      - name: Upload importable game files
        uses: actions/upload-artifact@v4
        with:
          name: HotPointFGames-game-files
          path: |
            game_source/dist/game_hall_lan_v6_2.py
            game_source/dist/game_hall_lan_v6_2.txt
          if-no-files-found: error
