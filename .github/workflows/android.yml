name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main, 'friend/**', 'feature/**']
    paths:
      - 'game_source/**'
      - 'app/**'
      - 'tools/**'
      - 'tests/test_android_bridge.py'
      - 'tests/test_game_update_manifest.py'
      - '*.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'game_source/**'
      - 'app/**'
      - 'tools/**'
      - 'tests/test_android_bridge.py'
      - 'tests/test_game_update_manifest.py'
      - '*.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android platform
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and sync game source
        run: |
          python tests/test_game_update_manifest.py
          python game_source/tests/smoke_test.py
          python game_source/tests/test_lite.py
          python game_source/tests/test_bots.py
          python game_source/tests/test_table.py
          python game_source/tests/test_other_tables.py
          python game_source/tests/test_feedback.py
          python game_source/tests/test_army.py
          python game_source/tests/test_army_feedback.py
          python game_source/tests/test_siege.py
          python game_source/tests/test_multiroom.py
          python game_source/tests/test_siege_dynamic.py
          python game_source/tests/test_siege_balance.py
          python game_source/tests/test_siege_fields.py
          python game_source/tests/test_siege_v12.py
          python game_source/tests/test_siege_v13.py
          python game_source/tests/test_siege_v14.py
          python game_source/tests/test_siege_v15.py
          python game_source/tests/test_siege_v16.py
          python game_source/tests/test_siege_v17.py
          python game_source/tests/test_siege_v18.py
          python game_source/tests/test_siege_v181.py
          python game_source/tests/test_siege_v182.py
          python game_source/tests/test_siege_v20.py
          python game_source/tests/test_siege_v201.py
          python game_source/tests/test_siege_map_pools.py
          python game_source/tests/test_siege_zmz_v20.py
          python game_source/tests/test_siege_zmz_v202.py
          python game_source/tests/test_siege_combo.py
          python game_source/tests/test_scores_all.py
          node game_source/tests/test_army_presentation.js
          python tools/sync_game_source.py
          python tests/test_android_bridge.py
      - name: Build Android APK
        run: bash gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HotPointFGames-Android
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload importable game files
        uses: actions/upload-artifact@v4
        with:
          name: HotPointFGames-game-files
          path: |
            game_source/dist/game_hall_lan_v6_2.py
            game_source/dist/game_hall_lan_v6_2.txt
          if-no-files-found: error

  publish-host:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HotPointFGames-Android
          path: publish
      - name: Publish versioned Android APK (non-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*versionName "\([^"]*\)".*/\1/p' app/build.gradle)"
          test -n "$VERSION"
          TAG="android-v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Host version $VERSION already published"
          else
            cp publish/app-debug.apk "publish/HotPointFGames-$VERSION.apk"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Android host $VERSION" --notes "Android ARM64 debug APK. Host update: direct game manifest download without GitHub REST API. Debug signing may differ from earlier builds; preserve local data before any uninstall. Game releases remain latest." \
              "publish/HotPointFGames-$VERSION.apk"
          fi
