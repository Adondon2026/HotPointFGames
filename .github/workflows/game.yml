name: Game files

on:
  workflow_dispatch:
  push:
    branches: [main, 'friend/**', 'feature/**', 'Zmz_dev']
    paths:
      - 'game_source/**'
      - '.github/workflows/game.yml'
      - 'tools/game_update_manifest.py'
      - 'tests/test_game_update_manifest.py'
  pull_request:
    branches: [main]
    paths:
      - 'game_source/**'
      - '.github/workflows/game.yml'
      - 'tools/game_update_manifest.py'
      - 'tests/test_game_update_manifest.py'

concurrency:
  group: game-files-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test and build
        run: |
          python tests/test_game_update_manifest.py
          python tests/test_zmz_channel.py
          node game_source/tests/test_siege_ui_regression.js
          node game_source/tests/test_siege_state_controls.js
          python game_source/tests/smoke_test.py
          python game_source/tests/test_lite.py
          python game_source/tests/test_bots.py
          python game_source/tests/test_table.py
          python game_source/tests/test_other_tables.py
          python game_source/tests/test_feedback.py
          python game_source/tests/test_army.py
          python game_source/tests/test_army_feedback.py
          python game_source/tests/test_siege.py
          python game_source/tests/test_multiroom.py
          python game_source/tests/test_siege_dynamic.py
          python game_source/tests/test_siege_balance.py
          python game_source/tests/test_siege_fields.py
          python game_source/tests/test_siege_v12.py
          python game_source/tests/test_siege_v13.py
          python game_source/tests/test_siege_v14.py
          python game_source/tests/test_siege_v15.py
          python game_source/tests/test_siege_v16.py
          python game_source/tests/test_siege_v17.py
          python game_source/tests/test_siege_v18.py
          python game_source/tests/test_siege_v181.py
          python game_source/tests/test_siege_v182.py
          python game_source/tests/test_siege_buff_filter.py
          python game_source/tests/test_siege_v20.py
          python game_source/tests/test_scores_all.py
          node game_source/tests/test_army_presentation.js
      - name: Generate update manifest
        run: |
          TAG="game-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          if [[ "${GITHUB_REF_NAME}" == "Zmz_dev" ]]; then
            TAG="zmz-game-v0.20.0-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          fi
          python tools/game_update_manifest.py game_source/dist/game_hall_lan_v6_2.py game_source/dist/game-update.json --version "$TAG"
      - name: Upload importable game files
        uses: actions/upload-artifact@v4
        with:
          name: HotPointFGames-game-files
          path: |
            game_source/dist/game_hall_lan_v6_2.py
            game_source/dist/game_hall_lan_v6_2.txt
            game_source/dist/game-update.json
          if-no-files-found: error

  release:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Zmz_dev') && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HotPointFGames-game-files
          path: publish
      - name: Publish tested game release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="game-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          if [[ "${GITHUB_REF_NAME}" == "Zmz_dev" ]]; then
            TAG="zmz-game-v0.20.0-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          fi
          if [[ "${GITHUB_REF_NAME}" == "Zmz_dev" ]]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
              --title "ZMZ v0.20.0 · game build ${GITHUB_RUN_NUMBER}" \
              --notes "ZMZ v0.20.0 development-channel game update. Branch: Zmz_dev. Source: $GITHUB_SHA. Only the ZMZ APK accepts this channel." \
              publish/game_hall_lan_v6_2.py publish/game-update.json
            # Keep the global GitHub latest-release pointer on main.
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
              --title "Game build ${GITHUB_RUN_NUMBER}" --notes "Tested mainline game update. Android host 1.3 or later. Source: $GITHUB_SHA" \
              publish/game_hall_lan_v6_2.py publish/game-update.json
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
